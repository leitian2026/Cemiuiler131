name: CI Build

on:
  # 仅手动触发：Actions → CI Build → Run workflow
  workflow_dispatch:

jobs:
  build_app:
    runs-on: ubuntu-latest
    name: Build App
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # 工程使用 Gradle 8.3 + Java 19 语法，需要 JDK 19 或 20（更高版本的 JDK 跑不动 Gradle 8.3）
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true

      - name: Check Signing Secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::error::缺少签名密钥：请在仓库 Settings → Secrets and variables → Actions 中添加 SIGNING_KEY、KEY_STORE_PASSWORD、ALIAS"
            exit 1
          fi

      - name: Create Sign File
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > key.jks
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_STORE_PASSWORD"
            echo "storeFile=key.jks"
          } > signing.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (Release)
        shell: bash
        run: ./gradlew assembleRelease

      - name: Find APKs
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::没有找到构建出的 APK"
            exit 1
          fi
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "APK_FILE_NAME=$(basename "$APK_FILE" .apk)" >> "$GITHUB_ENV"

      - name: Show APKs SHA256
        if: success()
        run: |
          # 文件名里带括号，必须通过带引号的环境变量使用，不能直接拼进命令
          APK_SHA256=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
          {
            echo "### Build Success"
            echo "|Artifact|SHA256|"
            echo "|:---:|:---|"
            echo "|Release|$APK_SHA256|"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          compression-level: 9
